{% extends "base.html" %}

{% block content %}

<body style="background-color:rgb(19 31 36);"></body>
  
</body>

<div class="max-w-5xl mx-auto px-4 py-10 ">

    <a
        href="{{ url_for('jornada') }}"
        class="text-indigo-600 font-bold "
    >
        ← Jornada
    </a >

    <h1 class="text-4xl font-black mt-5 ">
        {{ ano.icone }} {{ ano.nome }}
    </h1>


    <div class="grid md:grid-cols-2 gap-5 mt-8  ">

        {% for tema_id, tema in ano.temas.items() %}

        <a
            href="{{
                url_for(
                    'tema',
                    ano_id=ano_id,
                    tema_id=tema_id
                )
            }}"
            class="
            group
            bg-white
            border
            rounded-3xl
            p-6
            hover:bg-indigo-500

           
            "
        >

            <div class="text-4xl group-hover:text-white">
                {{ tema.icone }}
            </div>

            <h2 class="font-black text-2xl mt-3 group-hover:text-white">
                {{ tema.nome }}
            </h2>

            <p class="text-slate-500 mt-2 group-hover:text-white">
                {{ tema.assuntos|length }}
                assuntos
            </p>

        </a>

        {% endfor %}

    </div>

</div>

{% endblock %}
