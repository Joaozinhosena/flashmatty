{% extends "base.html" %}

{% block title %}
Criar conta - FlashMatty
{% endblock %}


{% block content %}

<div
    class="
        min-h-screen
        bg-slate-900
        px-4
        py-8

        flex
        items-center
        justify-center
    "
>

    <div
        class="
            w-full
            max-w-6xl

            flex
            flex-col
            items-center
            justify-center
            gap-6

            lg:grid
            lg:grid-cols-[1fr_28rem_1fr]
            lg:gap-8
        "
    >

        <!-- ================================================= -->
        <!-- PINGUIM ESQUERDO -->
        <!-- ================================================= -->

        <div
            class="
                hidden
                lg:flex
                justify-end
                items-center
            "
        >

            <img
                src="https://media1.tenor.com/m/SQ-iPKrB7Q4AAAAd/penguin.gif"

                alt="Pinguim"

                class="
                    w-full
                    max-w-[260px]
                    h-auto
                    object-contain
                "
            >

        </div>


        <!-- ================================================= -->
        <!-- FORMULÁRIO -->
        <!-- ================================================= -->

        <section
            class="
                w-full
                max-w-md

                bg-indigo-600

                rounded-3xl
                shadow-2xl

                border
                border-indigo-500

                p-5
                sm:p-7
                md:p-8
            "
        >

            <!-- ================================================= -->
            <!-- CABEÇALHO -->
            <!-- ================================================= -->

            <div class="text-center">

                <div
                    class="
                        lg:hidden
                        text-5xl
                        mb-3
                    "
                >
                    🐧
                </div>


                <p
                    class="
                        text-xs
                        uppercase
                        tracking-widest
                        font-black
                        text-indigo-200
                    "
                >
                    FlashMatty
                </p>


                <h1
                    class="
                        text-2xl
                        sm:text-3xl

                        font-black
                        text-white

                        mt-1
                    "
                >
                    Criar conta
                </h1>


                <p
                    class="
                        text-sm
                        sm:text-base

                        text-indigo-100

                        mt-2
                        mb-7
                    "
                >
                    Insira seus dados para começar sua jornada.
                </p>

            </div>


            <!-- ================================================= -->
            <!-- FORMULÁRIO -->
            <!-- ================================================= -->

            <form
                method="POST"
                class="space-y-4"
            >

                <!-- NOME -->

                <div>

                    <label
                        for="nome"

                        class="
                            block
                            font-bold
                            text-white
                            mb-2
                        "
                    >
                        Nome
                    </label>


                    <input
                        id="nome"
                        name="nome"
                        type="text"

                        required

                        autocomplete="name"

                        placeholder="Digite seu nome"

                        class="
                            w-full

                            bg-white

                            border-2
                            border-indigo-300

                            focus:border-yellow-300
                            focus:ring-4
                            focus:ring-yellow-300/20

                            outline-none

                            px-4
                            py-3

                            text-base
                            text-slate-800

                            rounded-xl

                            transition
                        "
                    >

                </div>


                <!-- USUÁRIO -->

                <div>

                    <label
                        for="username"

                        class="
                            block
                            font-bold
                            text-white
                            mb-2
                        "
                    >
                        Usuário
                    </label>


                    <input
                        id="username"
                        name="username"
                        type="text"

                        required

                        autocomplete="username"

                        placeholder="Escolha um usuário"

                        class="
                            w-full

                            bg-white

                            border-2
                            border-indigo-300

                            focus:border-yellow-300
                            focus:ring-4
                            focus:ring-yellow-300/20

                            outline-none

                            px-4
                            py-3

                            text-base
                            text-slate-800

                            rounded-xl

                            transition
                        "
                    >

                </div>


                <!-- SENHA -->

                <div>

                    <label
                        for="senha"

                        class="
                            block
                            font-bold
                            text-white
                            mb-2
                        "
                    >
                        Senha
                    </label>


                    <div class="relative">

                        <input
                            id="senha"
                            name="senha"
                            type="password"

                            required

                            autocomplete="new-password"

                            placeholder="Crie uma senha"

                            class="
                                w-full

                                bg-white

                                border-2
                                border-indigo-300

                                focus:border-yellow-300
                                focus:ring-4
                                focus:ring-yellow-300/20

                                outline-none

                                px-4
                                py-3
                                pr-14

                                text-base
                                text-slate-800

                                rounded-xl

                                transition
                            "
                        >


                        <button
                            type="button"
                            id="mostrar-senha"

                            class="
                                absolute
                                right-4
                                top-1/2
                                -translate-y-1/2

                                text-slate-500
                                hover:text-indigo-600

                                font-black
                            "
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- CONFIRMAR SENHA -->

                <div>

                    <label
                        for="confirmar_senha"

                        class="
                            block
                            font-bold
                            text-white
                            mb-2
                        "
                    >
                        Confirmar senha
                    </label>


                    <div class="relative">

                        <input
                            id="confirmar_senha"
                            name="confirmar_senha"
                            type="password"

                            required

                            autocomplete="new-password"

                            placeholder="Digite a senha novamente"

                            class="
                                w-full

                                bg-white

                                border-2
                                border-indigo-300

                                focus:border-yellow-300
                                focus:ring-4
                                focus:ring-yellow-300/20

                                outline-none

                                px-4
                                py-3
                                pr-14

                                text-base
                                text-slate-800

                                rounded-xl

                                transition
                            "
                        >


                        <button
                            type="button"
                            id="mostrar-confirmacao"

                            class="
                                absolute
                                right-4
                                top-1/2
                                -translate-y-1/2

                                text-slate-500
                                hover:text-indigo-600

                                font-black
                            "
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- AVISO -->

                <p
                    id="aviso-senha"

                    class="
                        min-h-5
                        text-sm
                        font-bold
                        text-yellow-200
                    "
                ></p>


                <!-- BOTÃO -->

                <button
                    type="submit"

                    class="
                        w-full

                        bg-slate-900
                        hover:bg-slate-800

                        active:scale-[0.98]

                        text-white
                        text-base
                        sm:text-lg
                        font-black

                        px-4
                        py-4

                        rounded-xl

                        shadow-lg

                        transition
                    "
                >
                    Criar minha conta 🚀
                </button>

            </form>


            <!-- ================================================= -->
            <!-- LOGIN -->
            <!-- ================================================= -->

            <div
                class="
                    mt-6
                    pt-5
                    border-t
                    border-white/20
                    text-center
                "
            >

                <p
                    class="
                        text-sm
                        text-indigo-100
                    "
                >
                    Já possui uma conta?
                </p>


                <a
                    href="{{ url_for('login') }}"

                    class="
                        inline-block
                        mt-2

                        text-yellow-300
                        hover:text-yellow-200

                        font-black

                        transition
                    "
                >
                    Entrar na minha conta →
                </a>

            </div>

        </section>


        <!-- ================================================= -->
        <!-- PERSONAGEM DIREITO -->
        <!-- ================================================= -->

        <div
            class="
                hidden
                lg:flex
                justify-start
                items-center
            "
        >

            <img
                src="https://i.pinimg.com/originals/a4/95/9d/a4959df7cd7900c5df9f3dadab08d7aa.gif"

                alt="Personagem animado"

                class="
                    w-full
                    max-w-[220px]
                    h-auto
                    object-contain
                "
            >

        </div>


        <!-- ================================================= -->
        <!-- PINGUIM MOBILE -->
        <!-- ================================================= -->

        <div
            class="
                flex
                lg:hidden
                justify-center
                items-center
                w-full
            "
        >

            <img
                src="https://media1.tenor.com/m/SQ-iPKrB7Q4AAAAd/penguin.gif"

                alt="Pinguim"

                class="
                    w-28
                    sm:w-36
                    h-auto
                    object-contain
                "
            >

        </div>

    </div>

</div>


{% endblock %}


{% block scripts %}

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const senha =
            document.getElementById(
                "senha"
            );

        const confirmar =
            document.getElementById(
                "confirmar_senha"
            );

        const mostrarSenha =
            document.getElementById(
                "mostrar-senha"
            );

        const mostrarConfirmacao =
            document.getElementById(
                "mostrar-confirmacao"
            );

        const aviso =
            document.getElementById(
                "aviso-senha"
            );


        function alternarSenha(
            campo,
            botao
        ) {

            if (
                campo.type ===
                "password"
            ) {

                campo.type =
                    "text";

                botao.textContent =
                    "🙈";

            } else {

                campo.type =
                    "password";

                botao.textContent =
                    "👁️";
            }
        }


        mostrarSenha.addEventListener(
            "click",
            () => {

                alternarSenha(
                    senha,
                    mostrarSenha
                );
            }
        );


        mostrarConfirmacao.addEventListener(
            "click",
            () => {

                alternarSenha(
                    confirmar,
                    mostrarConfirmacao
                );
            }
        );


        function verificarSenhas() {

            if (
                confirmar.value === ""
            ) {

                aviso.textContent =
                    "";

                return;
            }


            if (
                senha.value ===
                confirmar.value
            ) {

                aviso.textContent =
                    "✓ As senhas são iguais.";

                aviso.className =
                    "min-h-5 text-sm font-bold text-green-300";

            } else {

                aviso.textContent =
                    "As senhas ainda não são iguais.";

                aviso.className =
                    "min-h-5 text-sm font-bold text-yellow-200";
            }
        }


        senha.addEventListener(
            "input",
            verificarSenhas
        );


        confirmar.addEventListener(
            "input",
            verificarSenhas
        );

    }
);

</script>

{% endblock %}
