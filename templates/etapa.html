{% extends "base.html" %}

{% block content %}

<div
    id="exercicio-app"

    data-voltar="{{
        url_for(
            'assunto',
            ano_id=session['tentativa']['ano'],
            tema_id=session['tentativa']['tema'],
            assunto_id=session['tentativa']['assunto']
        )
    }}"

    class="
        max-w-3xl
        mx-auto
        px-4
        py-10
    "
>

    <!-- ===================================================== -->
    <!-- TOPO -->
    <!-- ===================================================== -->

    <div
        class="
            flex
            justify-between
            items-center
            gap-4
        "
    >

        <!-- VOLTAR -->

        <a
            href="{{
                url_for(
                    'assunto',
                    ano_id=session['tentativa']['ano'],
                    tema_id=session['tentativa']['tema'],
                    assunto_id=session['tentativa']['assunto']
                )
            }}"

            class="
                text-slate-500
                font-black
                text-xl
                hover:text-slate-800
            "
        >
            ✕
        </a>


        <!-- PROGRESSO -->

        <div class="flex-1">

            <div
                class="
                    flex
                    justify-between
                    items-center
                    mb-2
                    text-xs
                    font-black
                    text-slate-500
                "
            >

                <span>
                    Progresso
                </span>

                <span id="texto-progresso">
                    0/{{ etapa.quantidade }}
                </span>

            </div>


            <div
                class="
                    bg-slate-200
                    h-4
                    rounded-full
                    overflow-hidden
                "
            >

                <div
                    id="barra-progresso"

                    class="
                        bg-indigo-500
                        h-full
                        rounded-full
                        transition-all
                        duration-500
                    "

                    style="width: 0%"
                ></div>

            </div>

        </div>


        <!-- XP / MOEDAS -->

        <div
            class="
                flex
                flex-col
                items-end
                text-sm
                font-black
            "
        >

            <div class="text-indigo-600">

                ⭐

                <span id="xp-atual">
                    {{ current_user.xp or 0 }}
                </span>

            </div>


            <div class="text-yellow-600">

                🪙

                <span id="moedas">
                    {{ current_user.moedas or 0 }}
                </span>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- CONTEÚDO -->
    <!-- ===================================================== -->

    <div
        class="
            mt-10
            rounded-3xl
            bg-white
            border
            border-slate-100
            shadow-lg
            p-5
            md:p-8
        "
    >

        <!-- NOME DA ETAPA -->

        <p
            class="
                uppercase
                tracking-wide
                text-sm
                font-black
                text-indigo-600
                text-center
            "
        >
            {{ etapa.nome }}
        </p>


        <!-- ================================================= -->
        <!-- VISUAL -->
        <!-- ================================================= -->

        <div
            id="visual"
            class="mt-7 min-h-0"
        ></div>


        <!-- ================================================= -->
        <!-- PERGUNTA -->
        <!-- ================================================= -->

        <h1
            id="pergunta"

            class="
                text-2xl
                md:text-4xl
                font-black
                mt-6
                text-center
                text-slate-900
            "
        >
            {{ questao_publica.pergunta }}
        </h1>


        <!-- ================================================= -->
        <!-- RESPOSTA DINÂMICA -->
        <!-- ================================================= -->

        <div
            id="resposta-area"
            class="mt-8"
        ></div>


        <!-- ================================================= -->
        <!-- FEEDBACK -->
        <!-- ================================================= -->

        <div
            id="feedback"

            class="
                mt-6
                min-h-12
                text-center
                text-lg
                font-black
            "
        ></div>


        <!-- ================================================= -->
        <!-- BOTÃO -->
        <!-- ================================================= -->

        <button
            id="botaoResponder"

            type="button"

            class="
                mt-6
                w-full
                bg-indigo-600
                hover:bg-indigo-700
                disabled:bg-indigo-300
                disabled:cursor-not-allowed
                text-white
                font-black
                text-lg
                rounded-2xl
                p-4
                transition
                shadow-lg
            "
        >
            Conferir 🚀
        </button>

    </div>

</div>


<!-- ========================================================= -->
<!-- QUESTÃO INICIAL -->
<!-- ========================================================= -->

<script
    id="questao-inicial"
    type="application/json"
>
{{ questao_publica | tojson }}
</script>


<!-- ========================================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================================= -->

<script
    src="{{ url_for('static', filename='js/exercicio.js') }}?v=20260918-1"
></script>

{% endblock %}
