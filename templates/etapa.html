{% extends "base.html" %}

{% block content %}

<div
    class="
    max-w-2xl
    mx-auto
    px-4
    py-10
    "
>

    <div
        id="jogo"
        data-voltar="{{
            url_for(
                'assunto',
                ano_id=session['tentativa']['ano'],
                tema_id=session['tentativa']['tema'],
                assunto_id=session['tentativa']['assunto']
            )
        }}"
    >

        <div
            class="
            flex
            justify-between
            items-center
            gap-4
            "
        >

            <a
                href="{{
                    url_for(
                        'assunto',
                        ano_id=session['tentativa']['ano'],
                        tema_id=session['tentativa']['tema'],
                        assunto_id=session['tentativa']['assunto']
                    )
                }}"
                class="
                text-slate-500
                font-black
                text-xl
                "
            >
                ✕
            </a>


            <div
                class="
                flex-1
                bg-slate-200
                h-4
                rounded-full
                overflow-hidden
                "
            >

                <div
                    id="barraProgresso"
                    class="
                    bg-indigo-500
                    h-full
                    rounded-full
                    "
                    style="width:0%"
                ></div>

            </div>


            <div class="font-black text-indigo-600">
                ⭐ <span id="xp">{{ current_user.xp or 0 }}</span>
            </div>

        </div>


        <div class="mt-10">

            <p
                class="
                uppercase
                tracking-wide
                text-sm
                font-black
                text-indigo-600
                "
            >
                {{ etapa.nome }}
            </p>


            <h1
                id="pergunta"
                class="
                text-2xl
                md:text-4xl
                font-black
                mt-3
                "
            >
                {{ questao.pergunta }}
            </h1>


            <div class="mt-8">

                <label
                    for="resposta"
                    class="
                    block
                    font-bold
                    mb-2
                    "
                >
                    Sua resposta
                </label>


                <input
                    id="resposta"
                    autocomplete="off"
                    inputmode="text"
                    class="
                    w-full
                    border-2
                    border-slate-300
                    rounded-2xl
                    p-4
                    text-xl
                    font-bold
                    focus:outline-none
                    focus:border-indigo-500
                    "
                >

            </div>


            <div
                id="feedback"
                class="
                mt-5
                min-h-12
                font-black
                "
            ></div>


            <button
                id="botaoResponder"
                type="button"
                class="
                mt-6
                w-full
                bg-indigo-600
                hover:bg-indigo-700
                text-white
                font-black
                text-lg
                rounded-2xl
                p-4
                "
            >
                Conferir
            </button>

        </div>

    </div>

</div>


<script
    src="{{
        url_for(
            'static',
            filename='js/etapa.js'
        )
    }}"
></script>

{% endblock %}
