
<script src="https://cdn.tailwindcss.com"></script>


{% extends "base.html" %}

{% block title %}
Entrar | Matemática
{% endblock %}


{% block content %}




<!--container do plano de fundo principal-->
<div
    class="
    min-h-[85vh]
    flex
    bg-blue-700
    items-center
    justify-center
    p-5
    "
>


<!--container do recebiemento de resposta-->
<div
    class="
    bg-white
    rounded-3xl
    shadow-xl
    p-8
    w-full
    max-w-md
    "
>

    <div class="text-center mb-8">


        <!--container com logo marca -->
        <div class="text-7xl">
            
            <img class="h-50 " src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1qcrWvK9QRTTjtVMYb2CwiN-dgTmbJYky8sh1dT8u-A&s=10">
        </div>

        <!--texto principal-->
        <h1
            class="
            text-3xl
            font-black
            text-blue-400
            mt-3
            "
        >
             FlashMatty
        </h1>


        <!--paragrafo texto princiapl-->
        <p class="text-gray-500 mt-2">
            aprenda matematica de um jeito insano
        </p>

    </div>


    <!--inicializacao do formulario com metodo post para envio de dados do cliente ate o modelo de tratamento de dados-->
    <form method="POST">

        <label class="font-bold">
            Usuário
        </label>

        <input
            name="username"
            required
            autocomplete="username"
            class="
            w-full
            border-2
            rounded-xl
            p-3
            mt-2
            mb-5
            focus:border-indigo-500
            outline-none
            "
        >


        <label class="font-bold">
            Senha
        </label>

        <input
            name="senha"
            type="password"
            required
            autocomplete="current-password"
            class="
            w-full
            border-2
            rounded-xl
            p-3
            mt-2
            mb-6
            focus:border-indigo-500
            outline-none
            "
        >


        <button
            class="

            w-full
            bg-blue-700
            hover:bg-indigo-700
            text-white
            font-black
            p-4
            rounded-xl
            "
        >
            Entrar 
        </button>

    </form>


    <p class="text-center mt-6">

        Ainda não possui uma conta?

        <a
            href="{{ url_for('cadastro') }}"
            class="text-indigo-600 font-bold"
        >
            Criar conta
        </a>

    </p>

</div>

</div>

{% endblock %}
