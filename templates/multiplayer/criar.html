{% extends "base.html" %}

{% block content %}

<div class="max-w-xl mx-auto px-4 py-10">

    <a
        href="{{ url_for('multiplayer.inicio') }}"
        class="font-bold text-indigo-600"
    >
        ← Voltar
    </a>

    <h1 class="text-4xl font-black mt-5">
        Criar partida 👑
    </h1>


    <form
        method="POST"
        class="
        bg-white
        border
        rounded-3xl
        p-6
        mt-8
        space-y-6
        "
    >

        <div>

            <label class="font-black">
                Conteúdo
            </label>

            <select
                name="assunto"
                class="
                w-full
                border
                rounded-xl
                p-4
                mt-2
                "
            >

                <option value="misto">
                    🎲 Matemática mista
                </option>

                <option value="adicao">
                    ➕ Adição
                </option>

                <option value="subtracao">
                    ➖ Subtração
                </option>

                <option value="multiplicacao">
                    ✖️ Multiplicação
                </option>

                <option value="divisao">
                    ➗ Divisão
                </option>

                <option value="fracao">
                    🍕 Frações
                </option>

                <option value="tempo">
                    ⏰ Tempo
                </option>

                <option value="area">
                    📐 Área
                </option>

                <option value="perimetro">
                    📏 Perímetro
                </option>

                <option value="angulo">
                    📐 Ângulos
                </option>

            </select>

        </div>


        <div>

            <label class="font-black">
                Rodadas
            </label>

            <select
                name="quantidade"
                class="
                w-full
                border
                rounded-xl
                p-4
                mt-2
                "
            >

                <option value="5">
                    5 rodadas
                </option>

                <option
                    value="10"
                    selected
                >
                    10 rodadas
                </option>

                <option value="15">
                    15 rodadas
                </option>

                <option value="20">
                    20 rodadas
                </option>

            </select>

        </div>


        <div>

            <label class="font-black">
                Tempo por questão
            </label>

            <select
                name="tempo"
                class="
                w-full
                border
                rounded-xl
                p-4
                mt-2
                "
            >

                <option value="10">
                    10 segundos
                </option>

                <option
                    value="20"
                    selected
                >
                    20 segundos
                </option>

                <option value="30">
                    30 segundos
                </option>

                <option value="45">
                    45 segundos
                </option>

            </select>

        </div>


        <button
            class="
            w-full
            bg-indigo-600
            text-white
            font-black
            rounded-2xl
            p-4
            "
        >
            Criar sala
        </button>

    </form>

</div>

{% endblock %}
