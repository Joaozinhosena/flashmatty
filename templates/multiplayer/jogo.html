{% extends "base.html" %}

{% block title %}
Partida | Matemática
{% endblock %}


{% block content %}

<div
    id="multiplayerGame"

    data-codigo="{{ codigo }}"
    data-jogador="{{ jogador_id }}"
    data-host="{{ 'true' if host else 'false' }}"

    class="
        max-w-4xl
        mx-auto
        px-4
        py-6
        md:py-10
    "
>


    <!-- TOPO DA PARTIDA -->
    <div
        class="
            bg-white
            border
            border-slate-200
            rounded-3xl
            shadow-sm
            p-5
            md:p-6
        "
    >

        <div
            class="
                flex
                flex-col
                sm:flex-row
                sm:justify-between
                sm:items-center
                gap-4
            "
        >


            <!-- RODADA -->
            <div>

                <p
                    class="
                        text-xs
                        uppercase
                        tracking-wider
                        font-bold
                        text-slate-400
                    "
                >
                    Progresso
                </p>

                <div
                    class="
                        text-lg
                        md:text-xl
                        font-black
                        text-slate-900
                        mt-1
                    "
                >

                    Rodada

                    <span
                        id="rodada"
                        class="text-indigo-600"
                    >
                        -
                    </span>

                    <span class="text-slate-400">
                        /
                    </span>

                    <span id="total">
                        -
                    </span>

                </div>

            </div>


            <!-- CRONÔMETRO -->
            <div
                class="
                    flex
                    items-center
                    justify-center
                    gap-2
                    bg-indigo-50
                    border
                    border-indigo-100
                    rounded-2xl
                    px-5
                    py-3
                "
            >

                <span class="text-xl">
                    ⏱️
                </span>

                <span
                    id="cronometro"
                    class="
                        text-2xl
                        font-black
                        text-indigo-700
                        tabular-nums
                    "
                >
                    --
                </span>

            </div>

        </div>


        <!-- BARRA DE TEMPO -->
        <div
            class="
                bg-slate-200
                h-3
                rounded-full
                mt-5
                overflow-hidden
            "
        >

            <div
                id="tempoBarra"
                class="
                    bg-indigo-500
                    h-full
                    rounded-full
                    transition-all
                    duration-300
                    ease-linear
                "
                style="width: 100%"
            >
            </div>

        </div>

    </div>



    <!-- ÁREA PRINCIPAL DA QUESTÃO -->
    <section
        id="areaPergunta"
        class="
            mt-6
            bg-white
            border
            border-slate-200
            rounded-3xl
            shadow-sm
            overflow-hidden
            min-h-[380px]
        "
    >


        <!-- ESTADO INICIAL -->
        <div
            class="
                min-h-[380px]
                flex
                flex-col
                items-center
                justify-center
                text-center
                px-6
                py-12
            "
        >

            <div
                class="
                    w-24
                    h-24
                    rounded-full
                    bg-indigo-50
                    flex
                    items-center
                    justify-center
                    text-6xl
                "
            >
                🎮
            </div>


            <h2
                class="
                    text-2xl
                    md:text-3xl
                    font-black
                    text-slate-900
                    mt-6
                "
            >
                Preparando partida...
            </h2>


            <p
                class="
                    text-slate-500
                    mt-2
                    max-w-md
                "
            >
                Aguarde enquanto a próxima questão é carregada.
            </p>


            <!-- ANIMAÇÃO DE CARREGAMENTO -->
            <div
                class="
                    flex
                    gap-2
                    mt-7
                "
            >

                <span
                    class="
                        w-3
                        h-3
                        bg-indigo-500
                        rounded-full
                        animate-bounce
                    "
                >
                </span>

                <span
                    class="
                        w-3
                        h-3
                        bg-indigo-500
                        rounded-full
                        animate-bounce
                    "
                    style="animation-delay: 150ms;"
                >
                </span>

                <span
                    class="
                        w-3
                        h-3
                        bg-indigo-500
                        rounded-full
                        animate-bounce
                    "
                    style="animation-delay: 300ms;"
                >
                </span>

            </div>

        </div>

    </section>



    <!-- INFORMAÇÃO DA SALA -->
    <div
        class="
            mt-5
            flex
            flex-col
            sm:flex-row
            justify-between
            items-center
            gap-3
            text-sm
            text-slate-400
        "
    >

        <div>

            Sala:

            <span
                class="
                    font-black
                    text-slate-600
                    tracking-wider
                "
            >
                {{ codigo }}
            </span>

        </div>


        {% if host %}

            <div
                class="
                    bg-amber-50
                    border
                    border-amber-200
                    text-amber-700
                    font-bold
                    px-3
                    py-1
                    rounded-full
                "
            >
                👑 Anfitrião
            </div>

        {% else %}

            <div
                class="
                    bg-indigo-50
                    border
                    border-indigo-100
                    text-indigo-600
                    font-bold
                    px-3
                    py-1
                    rounded-full
                "
            >
                🎮 Jogador
            </div>

        {% endif %}

    </div>

</div>



<!-- SOCKET.IO -->
<script
    src="https://cdn.socket.io/4.8.1/socket.io.min.js"
></script>


<!-- JAVASCRIPT DO MULTIPLAYER -->
<script
    src="{{ url_for(
        'static',
        filename='js/multiplayer/jogo.js'
    ) }}"
></script>


{% endblock %}
